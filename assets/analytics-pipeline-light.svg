<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Sohila's analytics pipeline</title>
  <desc id="desc">Raw data flows through ETL, a warehouse, a semantic model, and business intelligence decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1e3a8a" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <text x="48" y="48" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">From raw data to trusted decisions</text>
  <text x="48" y="76" font-family="Inter,Arial,sans-serif" font-size="14" fill="#475569">A practical analytics architecture built around reliable data, measurable outcomes, and clear business context.</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(45 125)"><rect width="190" height="90" rx="16" fill="#fff" stroke="#bfdbfe"/><circle cx="38" cy="45" r="20" fill="#dbeafe"/><text x="38" y="51" font-size="20" fill="#1d4ed8">01</text><text x="112" y="39" font-size="15" font-weight="700" fill="#0f172a">Raw data</text><text x="112" y="61" font-size="12" fill="#64748b">SQL · APIs · files</text></g>
    <g transform="translate(275 125)"><rect width="190" height="90" rx="16" fill="#fff" stroke="#bae6fd"/><circle cx="38" cy="45" r="20" fill="#cffafe"/><text x="38" y="51" font-size="20" fill="#0369a1">02</text><text x="112" y="39" font-size="15" font-weight="700" fill="#0f172a">ETL / ELT</text><text x="112" y="61" font-size="12" fill="#64748b">Python · Airflow</text></g>
    <g transform="translate(505 125)"><rect width="190" height="90" rx="16" fill="#fff" stroke="#c7d2fe"/><circle cx="38" cy="45" r="20" fill="#e0e7ff"/><text x="38" y="51" font-size="20" fill="#4338ca">03</text><text x="112" y="39" font-size="15" font-weight="700" fill="#0f172a">Warehouse</text><text x="112" y="61" font-size="12" fill="#64748b">Star schema · SQL</text></g>
    <g transform="translate(735 125)"><rect width="190" height="90" rx="16" fill="#fff" stroke="#ddd6fe"/><circle cx="38" cy="45" r="20" fill="#ede9fe"/><text x="38" y="51" font-size="20" fill="#7c3aed">04</text><text x="112" y="39" font-size="15" font-weight="700" fill="#0f172a">Semantic model</text><text x="112" y="61" font-size="12" fill="#64748b">DAX · KPIs</text></g>
    <g transform="translate(965 125)"><rect width="190" height="90" rx="16" fill="#fff" stroke="#bbf7d0"/><circle cx="38" cy="45" r="20" fill="#dcfce7"/><text x="38" y="51" font-size="20" fill="#15803d">05</text><text x="112" y="39" font-size="15" font-weight="700" fill="#0f172a">Decision</text><text x="112" y="61" font-size="12" fill="#64748b">Power BI · action</text></g>
  </g>
  <g stroke="url(#flow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12" fill="none"><path d="M235 170H275"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.5s" repeatCount="indefinite"/></path><path d="M465 170H505"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.5s" repeatCount="indefinite"/></path><path d="M695 170H735"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.5s" repeatCount="indefinite"/></path><path d="M925 170H965"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.5s" repeatCount="indefinite"/></path></g>
  <text x="600" y="263" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">Reliable foundations · auditable models · actionable intelligence</text>
</svg>
