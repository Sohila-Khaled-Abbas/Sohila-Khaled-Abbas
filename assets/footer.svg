<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Animated analytics footer</title>
  <desc id="desc">A calm animated footer with flowing data points and a star-schema inspired network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1220"/><stop offset=".5" stop-color="#172554"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="150" rx="22" fill="url(#bg)"/>
  <g fill="none" stroke="url(#line)" stroke-width="2" opacity=".75">
    <path d="M30 112 C150 42 245 120 360 70 S570 42 690 90 S910 130 1170 48" stroke-dasharray="4 12"><animate attributeName="stroke-dashoffset" from="0" to="-160" dur="7s" repeatCount="indefinite"/></path>
    <path d="M30 125 C150 55 245 133 360 83 S570 55 690 103 S910 143 1170 61" stroke-dasharray="2 18" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-220" dur="9s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#e0f2fe" opacity=".9">
    <circle cx="168" cy="84" r="4"><animate attributeName="cy" values="84;72;84" dur="3s" repeatCount="indefinite"/></circle><circle cx="430" cy="72" r="4"><animate attributeName="cy" values="72;85;72" dur="3.7s" repeatCount="indefinite"/></circle><circle cx="728" cy="91" r="4"><animate attributeName="cy" values="91;78;91" dur="4.2s" repeatCount="indefinite"/></circle><circle cx="1010" cy="94" r="4"><animate attributeName="cy" values="94;80;94" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(520 34)" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity=".65"><path d="M80 42L20 8M80 42L20 76M80 42L140 8M80 42L140 76"/><circle cx="80" cy="42" r="18" fill="#1e3a8a"/><circle cx="20" cy="8" r="8" fill="#172554"/><circle cx="20" cy="76" r="8" fill="#172554"/><circle cx="140" cy="8" r="8" fill="#172554"/><circle cx="140" cy="76" r="8" fill="#172554"/></g>
  <text x="600" y="132" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="12">Building trustworthy data systems, one decision at a time.</text>
</svg>
