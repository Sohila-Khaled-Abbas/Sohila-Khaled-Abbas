<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="50%" stop-color="#0E1424" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#4FACFE" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#7928CA" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#38EFCB" />
      <stop offset="70%" stop-color="#6991F6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="sub-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pill-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.5" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1.2" fill="#00F2FE" fill-opacity="0.25" />
    </pattern>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace;
        font-weight: 600;
        letter-spacing: 2px;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        letter-spacing: 0.5px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace;
        font-weight: 600;
        font-size: 13px;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes float-node {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .node-pulse {
        animation: pulse-glow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .node-float {
        animation: float-node 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="1180" height="370" rx="20" fill="url(#bg-gradient)" />
  <rect x="10" y="10" width="1180" height="370" rx="20" fill="url(#cyber-grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="90" r="120" fill="#00F2FE" opacity="0.12" filter="url(#glow-cyan)" />
  <circle cx="1050" cy="180" r="160" fill="#7928CA" opacity="0.16" filter="url(#glow-purple)" />
  <circle cx="600" cy="320" r="100" fill="#FF007A" opacity="0.08" filter="url(#glow-purple)" />

  <!-- Border Outline -->
  <rect x="10" y="10" width="1180" height="370" rx="20" fill="none" stroke="url(#border-gradient)" stroke-width="2" />

  <!-- Terminal Window Controls & Header Bar -->
  <g transform="translate(40, 36)">
    <circle cx="0" cy="0" r="6" fill="#FF5F56" />
    <circle cx="20" cy="0" r="6" fill="#FFBD2E" />
    <circle cx="40" cy="0" r="6" fill="#27C93F" />
    <text x="70" y="4" fill="#64748B" font-family="'Fira Code', monospace" font-size="12" font-weight="500">sohila-khaled-abbas // analytics-engineering-core</text>
  </g>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(970, 36)">
    <rect x="-10" y="-12" width="190" height="26" rx="13" fill="#0F172A" stroke="#22C55E" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="6" cy="1" r="4" fill="#22C55E" class="node-pulse" />
    <text x="20" y="5" fill="#4ADE80" font-family="'Fira Code', monospace" font-size="11.5" font-weight="600">LIVE SYSTEM ACTIVE</text>
  </g>

  <!-- Constellation / Star Schema Diagram Visual (Left Side Graphic) -->
  <g transform="translate(90, 195)" class="node-float" opacity="0.75">
    <!-- Star Schema Fact Table & Dimension Links -->
    <line x1="0" y1="0" x2="-45" y2="-45" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="0" y1="0" x2="45" y2="-45" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="0" y1="0" x2="-55" y2="35" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="0" y1="0" x2="55" y2="35" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="3,3" />
    
    <!-- Central Fact Node -->
    <circle cx="0" cy="0" r="14" fill="#00F2FE" fill-opacity="0.2" stroke="#00F2FE" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#00F2FE" />
    
    <!-- Dimension Nodes -->
    <circle cx="-45" cy="-45" r="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="45" cy="-45" r="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="-55" cy="35" r="8" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
    <circle cx="55" cy="35" r="8" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
  </g>

  <!-- Constellation Graphic (Right Side Graphic) -->
  <g transform="translate(1110, 195)" class="node-float" opacity="0.75">
    <line x1="0" y1="0" x2="-40" y2="-40" stroke="#C084FC" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="0" y1="0" x2="40" y2="-40" stroke="#C084FC" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="0" y1="0" x2="-45" y2="40" stroke="#F472B6" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="0" y1="0" x2="45" y2="40" stroke="#F472B6" stroke-width="1.2" stroke-dasharray="3,3" />

    <circle cx="0" cy="0" r="14" fill="#7928CA" fill-opacity="0.25" stroke="#C084FC" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#C084FC" />

    <circle cx="-40" cy="-40" r="8" fill="#1E293B" stroke="#C084FC" stroke-width="1.5" />
    <circle cx="40" cy="-40" r="8" fill="#1E293B" stroke="#C084FC" stroke-width="1.5" />
    <circle cx="-45" cy="40" r="8" fill="#1E293B" stroke="#F472B6" stroke-width="1.5" />
    <circle cx="45" cy="40" r="8" fill="#1E293B" stroke="#F472B6" stroke-width="1.5" />
  </g>

  <!-- Center Content Area -->
  <g text-anchor="middle" transform="translate(600, 0)">
    <!-- Primary Title -->
    <text x="0" y="132" class="title" fill="url(#title-gradient)" font-size="44">SOHILA KHALED ABBAS</text>

    <!-- Subtitle / Role -->
    <text x="0" y="172" class="subtitle" fill="url(#sub-gradient)" font-size="17">DATA &amp; ANALYTICS ENGINEER • KIMBALL DWH ARCHITECT • BI SYSTEMS</text>

    <!-- Core Philosophy / Value Statement -->
    <text x="0" y="210" class="tagline" fill="#94A3B8" font-size="15.5">
      Transforming Raw Operational Transactions into <tspan fill="#38BDF8" font-weight="600">Auditable, High-Conviction Business Decisions</tspan>
    </text>

    <!-- Tech Arsenal Pills Row -->
    <g transform="translate(0, 252)">
      <!-- Pill 1 -->
      <g transform="translate(-465, 0)">
        <rect x="0" y="0" width="170" height="38" rx="10" fill="url(#pill-bg)" stroke="url(#pill-border)" stroke-width="1.2" />
        <text x="85" y="24" text-anchor="middle" fill="#E2E8F0" class="pill-text">🏛️ Kimball Star Schema</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(-280, 0)">
        <rect x="0" y="0" width="175" height="38" rx="10" fill="url(#pill-bg)" stroke="url(#pill-border)" stroke-width="1.2" />
        <text x="87" y="24" text-anchor="middle" fill="#E2E8F0" class="pill-text">⚙️ Airflow &amp; Python ETL</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(-90, 0)">
        <rect x="0" y="0" width="180" height="38" rx="10" fill="url(#pill-bg)" stroke="url(#pill-border)" stroke-width="1.2" />
        <text x="90" y="24" text-anchor="middle" fill="#E2E8F0" class="pill-text">📊 Power BI &amp; Adv. DAX</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(105, 0)">
        <rect x="0" y="0" width="175" height="38" rx="10" fill="url(#pill-bg)" stroke="url(#pill-border)" stroke-width="1.2" />
        <text x="87" y="24" text-anchor="middle" fill="#E2E8F0" class="pill-text">🤖 100% Prec@50 ML</text>
      </g>

      <!-- Pill 5 -->
      <g transform="translate(295, 0)">
        <rect x="0" y="0" width="170" height="38" rx="10" fill="url(#pill-bg)" stroke="url(#pill-border)" stroke-width="1.2" />
        <text x="85" y="24" text-anchor="middle" fill="#FCD34D" class="pill-text">🏆 #1 BI Creator (EG)</text>
      </g>
    </g>

    <!-- Bottom Metadata / Stats Line -->
    <g transform="translate(0, 328)">
      <text x="-260" y="0" fill="#64748B" font-family="'Fira Code', monospace" font-size="12" font-weight="500">⚡ REFRESH: &lt;15 MIN</text>
      <circle cx="-160" cy="-4" r="2.5" fill="#334155" />
      <text x="-60" y="0" fill="#64748B" font-family="'Fira Code', monospace" font-size="12" font-weight="500">🚀 QUERY OPT: +25%</text>
      <circle cx="45" cy="-4" r="2.5" fill="#334155" />
      <text x="145" y="0" fill="#64748B" font-family="'Fira Code', monospace" font-size="12" font-weight="500">☕ FOUNDER: THE DATA TEA</text>
      <circle cx="250" cy="-4" r="2.5" fill="#334155" />
      <text x="325" y="0" fill="#64748B" font-family="'Fira Code', monospace" font-size="12" font-weight="500">📍 EGYPT</text>
    </g>
  </g>
</svg>
