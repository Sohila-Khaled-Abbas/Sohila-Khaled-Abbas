<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Sohila Khaled Abbas — analytics engineering profile</title>
  <desc id="desc">Animated dark header with flowing data lines, terminal-style code markers, and analytics nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset=".52" stop-color="#101d3d"/><stop offset="1" stop-color="#21143f"/></linearGradient>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="270" rx="24" fill="url(#bg)"/>
  <circle cx="980" cy="44" r="90" fill="#7c3aed" opacity=".18" filter="url(#blur)"><animate attributeName="cx" values="980;1050;980" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="170" cy="240" r="78" fill="#0891b2" opacity=".14" filter="url(#blur)"><animate attributeName="cy" values="240;205;240" dur="8s" repeatCount="indefinite"/></circle>
  <g fill="none" stroke="url(#glow)" stroke-linecap="round" opacity=".6">
    <path d="M-30 215 C170 105 255 248 430 142 S720 72 920 146 S1110 205 1240 105" stroke-width="3" stroke-dasharray="2 16"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur="6s" repeatCount="indefinite"/></path>
    <path d="M-30 235 C170 125 255 268 430 162 S720 92 920 166 S1110 225 1240 125" stroke-width="1" stroke-dasharray="1 12"><animate attributeName="stroke-dashoffset" from="0" to="-140" dur="5s" repeatCount="indefinite"/></path>
  </g>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="56" y="46" width="360" height="132" rx="18" fill="#0b1220" fill-opacity=".82" stroke="#334155"/>
    <circle cx="82" cy="73" r="6" fill="#fb7185"/><circle cx="103" cy="73" r="6" fill="#facc15"/><circle cx="124" cy="73" r="6" fill="#4ade80"/>
    <text x="82" y="108" fill="#67e8f9" font-size="14">$ python analytics_pipeline.py</text>
    <text x="82" y="134" fill="#c4b5fd" font-size="13">→ validate(data)</text>
    <text x="82" y="158" fill="#93c5fd" font-size="13">→ model(star_schema)</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" fill="#f8fafc">
    <text x="478" y="102" font-size="31" font-weight="750">Sohila Khaled Abbas</text>
    <text x="480" y="134" font-size="16" fill="#cbd5e1">Data Analyst · BI Developer · Data Engineering</text>
    <text x="480" y="171" font-size="13" fill="#94a3b8">Reliable pipelines · auditable models · actionable intelligence</text>
  </g>
  <g fill="none" stroke="#7dd3fc" stroke-width="2" opacity=".75">
    <circle cx="1070" cy="82" r="22"><animate attributeName="r" values="22;30;22" dur="4s" repeatCount="indefinite"/></circle><circle cx="1070" cy="82" r="42" opacity=".4"><animate attributeName="r" values="42;58;42" dur="4s" repeatCount="indefinite"/></circle>
    <path d="M1070 60V104M1048 82H1092"/>
  </g>
  <text x="1048" y="153" fill="#c4b5fd" font-family="monospace" font-size="12">BI / SQL / ETL</text>
