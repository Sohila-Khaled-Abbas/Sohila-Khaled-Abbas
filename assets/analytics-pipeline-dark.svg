<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Sohila's analytics pipeline</title>
  <desc id="desc">Raw data flows through ETL, a warehouse, a semantic model, and business intelligence decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1e3a8a" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <text x="48" y="48" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">From raw data to trusted decisions</text>
  <text x="48" y="76" font-family="Inter,Arial,sans-serif" font-size="14" fill="#cbd5e1">A practical analytics architecture built around reliable data, measurable outcomes, and clear business context.</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(45 125)"><rect width="190" height="90" rx="16" fill="#111827" stroke="#1d4ed8"/><circle cx="38" cy="45" r="20" fill="#1e3a8a"/><text x="38" y="51" font-size="20" fill="#1d4ed8">01</text><text x="112" y="39" font-size="15" font-weight="700" fill="#f8fafc">Raw data</text><text x="112" y="61" font-size="12" fill="#94a3b8">SQL · APIs · files</text></g>
    <g transform="translate(275 125)"><rect width="190" height="90" rx="16" fill="#111827" stroke="#0284c7"/><circle cx="38" cy="45" r="20" fill="#164e63"/><text x="38" y="51" font-size="20" fill="#0369a1">02</text><text x="112" y="39" font-size="15" font-weight="700" fill="#f8fafc">ETL / ELT</text><text x="112" y="61" font-size="12" fill="#94a3b8">Python · Airflow</text></g>
    <g transform="translate(505 125)"><rect width="190" height="90" rx="16" fill="#111827" stroke="#4f46e5"/><circle cx="38" cy="45" r="20" fill="#312e81"/><text x="38" y="51" font-size="20" fill="#4338ca">03</text><text x="112" y="39" font-size="15" font-weight="700" fill="#f8fafc">Warehouse</text><text x="112" y="61" font-size="12" fill="#94a3b8">Star schema · SQL</text></g>
    <g transform="translate(735 125)"><rect width="190" height="90" rx="16" fill="#111827" stroke="#7c3aed"/><circle cx="38" cy="45" r="20" fill="#4c1d95"/><text x="38" y="51" font-size="20" fill="#7c3aed">04</text><text x="112" y="39" font-size="15" font-weight="700" fill="#f8fafc">Semantic model</text><text x="112" y="61" font-size="12" fill="#94a3b8">DAX · KPIs</text></g>
    <g transform="translate(965 125)"><rect width="190" height="90" rx="16" fill="#111827" stroke="#16a34a"/><circle cx="38" cy="45" r="20" fill="#14532d"/><text x="38" y="51" font-size="20" fill="#15803d">05</text><text x="112" y="39" font-size="15" font-weight="700" fill="#f8fafc">Decision</text><text x="112" y="61" font-size="12" fill="#94a3b8">Power BI · action</text></g>
  </g>
  <g stroke="url(#flow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12" fill="none"><path d="M235 170H275"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.5s" repeatCount="indefinite"/></path><path d="M465 170H505"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.5s" repeatCount="indefinite"/></path><path d="M695 170H735"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.5s" repeatCount="indefinite"/></path><path d="M925 170H965"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.5s" repeatCount="indefinite"/></path></g>
  <text x="600" y="263" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8">Reliable foundations · auditable models · actionable intelligence</text>
</svg>
