name: Update visitor analytics

on:
  schedule:
    - cron: "11 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/visitor-analytics.yml"
      - "scripts/update_visitor_chart.py"

permissions:
  contents: write

jobs:
  visitor-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Collect traffic and render visitor chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/update_visitor_chart.py

      - name: Commit and push visitor analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visitor-analytics.json assets/visitor-analytics.svg
          git commit -m "chore: update visitor analytics" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
