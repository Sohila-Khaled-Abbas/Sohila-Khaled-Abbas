name: Update visitor analytics

on:
  schedule:
    - cron: "11 3 * * 1" # Every Monday at 03:11 UTC
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/visitor-analytics.yml"
      - "scripts/update_visitor_chart.py"

permissions:
  contents: write

jobs:
  visitor-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check traffic token availability
        id: traffic-token
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -n "$TRAFFIC_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "TRAFFIC_TOKEN is not configured; preserving the last valid chart snapshot."
          fi

      - name: Collect traffic and render visitor chart
        if: steps.traffic-token.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/update_visitor_chart.py

      - name: Commit and push visitor analytics
        if: steps.traffic-token.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visitor-analytics.json assets/visitor-analytics.svg
          git commit -m "chore: update visitor analytics" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
