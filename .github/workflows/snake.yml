name: Update contribution animation

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=%237c3aed&color_dots=%23e2e8f0,%23bae6fd,%2360a5fa,%232563eb,%237c3aed
            assets/github-snake-dark.svg?color_snake=%2322d3ee&color_dots=%230b1220,%230e7490,%230ea5e9,%2322d3ee,%23a78bfa&color_background=%230b1220

      - name: Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          git commit -m "chore: update contribution animation" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
